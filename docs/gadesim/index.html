<style>
  :root { color-scheme: only light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: #141b24;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;

  #stage {
    position: fixed; inset: 0; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: #141b24;
  }
  #game { display: block; touch-action: none; image-rendering: auto; }
  #rot {
    position: fixed; inset: 0; display: none; z-index: 5;
    align-items: center; justify-content: center; text-align: center;
    background: #141b24; color: #ffcf3f; padding: 24px;
    font: 700 17px/1.5 "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;

  @media (orientation: landscape) and (max-height: 430px) {
    #rot { display: flex; }

  /* ---- kalıcı ayarlar ----------------------------------------------- */
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  best = parseInt(lsGet('gadesim_best', '0'), 10) || 0;
  var soundOn = lsGet('gadesim_sound', '1') !== '0';

  /* =====================================================================
     SES: konuşma (Web Speech API) + kısa efektler (Web Audio)
  ===================================================================== */
  var TTS = {
    synth: (typeof window !== 'undefined' && window.speechSynthesis) ? window.speechSynthesis : null,
    voice: null,
    primed: false,
    pick: function () {
      if (!this.synth) return;
      var vs = [];
      try { vs = this.synth.getVoices() || []; } catch (e) { return; }
      var tr = null, i;
      for (i = 0; i < vs.length; i++) { if (/^tr/i.test(vs[i].lang || '')) { tr = vs[i]; break; } }
      if (!tr) for (i = 0; i < vs.length; i++) { if (/turk|türk/i.test(vs[i].name || '')) { tr = vs[i]; break; } }
      this.voice = tr;
    },
    prime: function () {
      // iOS/Safari konuşmayı ilk kullanıcı hareketine kadar kilitler.
      if (!this.synth || this.primed) return;
      this.primed = true;
      try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'tr-TR'; this.synth.speak(u); } catch (e) {}
    },
    say: function (text, rate) {
      if (!soundOn || !this.synth) return;
      try {
        if (this.synth.speaking || this.synth.pending) this.synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'tr-TR';
        if (this.voice) u.voice = this.voice;
        u.rate = rate || 1.05; u.pitch = 1; u.volume = 1;
        this.synth.speak(u);
      } catch (e) {}
    },
    stop: function () { try { if (this.synth) this.synth.cancel(); } catch (e) {} }
  };
  if (TTS.synth) {
    TTS.pick();
    try { TTS.synth.onvoiceschanged = function () { TTS.pick(); }; } catch (e) {}
  }

  var ac = null;
  function audio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(f1, f2, dur, type, vol, delay) {
    if (!soundOn) return;
    var a = audio(); if (!a) return;
    try {
      var t0 = a.currentTime + (delay || 0);
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t0);
      if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {
    point: function () { tone(880, 880, 0.06, 'square', 0.05); tone(1320, 1320, 0.09, 'square', 0.05, 0.05); },
    hit:   function () { tone(190, 55, 0.22, 'sawtooth', 0.09); },
    level: function () { tone(660, 660, 0.08, 'triangle', 0.06); tone(880, 880, 0.08, 'triangle', 0.06, 0.08); tone(1320, 1320, 0.16, 'triangle', 0.06, 0.16); }
  };

  /* =====================================================================
     YERLEŞİM
  ===================================================================== */
  function buildSky() {
    var p = pal();
    skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0, p.sky1);
    skyGrad.addColorStop(1, p.sky2);
  }

  function layout() {
    var sw = stage.clientWidth  || window.innerWidth;
    var sh = stage.clientHeight || window.innerHeight;
    if (!sw || !sh) return;

    // Yükseklik ekran oranından türetilir; çok geniş/çok uzun ekranlarda sınırlanır.
    H = Math.max(460, Math.min(820, Math.round(W * sh / sw)));
    GROUND_Y = H - GROUND_H;
    scale = Math.min(sw / W, sh / H);

    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width  = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    cv.style.width  = (W * scale) + 'px';
    cv.style.height = (H * scale) + 'px';
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.textBaseline = 'middle';

    // Ekran küçüldüyse mevcut boşlukları geçerli aralığa çek.
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      p.gapY = Math.max(52, Math.min(p.gapY, GROUND_Y - p.gap - 52));
    }
    if (bird.y > GROUND_Y - R) bird.y = GROUND_Y - R;
    if (state === 'menu') bird.y = GROUND_Y * 0.46;

    buildSky();
    buildDecor();
  }

  function buildDecor() {
    clouds = [];
    for (var i = 0; i < 5; i++) {
      clouds.push({ x: Math.random() * W, y: 40 + Math.random() * (GROUND_Y * 0.42), s: 0.7 + Math.random() * 0.8 });
    }
    buildings = [];
    var x = 0;
    while (x < W + 90) {
      var w = 24 + Math.random() * 30;
      buildings.push({ x: x, w: w, h: 34 + Math.random() * 62 });
      x += w + 4 + Math.random() * 10;
    }
    stars = [];
    for (var k = 0; k < 34; k++) {
      stars.push({ x: Math.random() * W, y: Math.random() * (GROUND_Y * 0.7), r: Math.random() < 0.25 ? 1.4 : 0.9 });
    }
  }

  var resizePending = false;
  function onResize() {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(function () { resizePending = false; layout(); });
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  /* =====================================================================
     OYUN AKIŞI
  ===================================================================== */
  function reset() {
    pipes = [];
    score = 0; level = 1; passedInLevel = 0;
    bird.y = GROUND_Y * 0.46; bird.vy = 0; bird.rot = 0;
    groundX = 0; bgFar = 0; bgNear = 0;
    bubble.until = 0; levelBannerUntil = 0; mutePhraseUntil = 0;
    flashUntil = 0; shake = 0; newBest = false;
    buildSky(); buildDecor();
  }

  function spawnPipe() {
    var gap = levelGap(level);
    var lo = 52, hi = GROUND_Y - gap - 52;
    if (hi < lo) hi = lo;
    var gapY;
    var prev = pipes.length ? pipes[pipes.length - 1] : null;
    if (prev) {
      // Ardışık borular arasında insanüstü sıçrama olmasın.
      var lo2 = Math.max(lo, prev.gapY - 130), hi2 = Math.min(hi, prev.gapY + 130);
      gapY = lo2 + Math.random() * Math.max(0, hi2 - lo2);
    } else {
      gapY = lo + Math.random() * (hi - lo);
    }
    var x = prev ? prev.x + SPACING : W + 40;
    pipes.push({ x: x, gapY: gapY, gap: gap, scored: false });
  }

  function flap() {
    bird.vy = FLAP;
    wingPhase = 0;
    if (Date.now() >= mutePhraseUntil) {
      TTS.say(SAY_FLAP, 1.15);
      bubble.text = SAY_FLAP;
      bubble.until = Date.now() + 620;
    }
  }

  function startGame() {
    reset();
    state = 'play';
    spawnPipe();
    flap();
  }

  function levelUp() {
    level++;
    passedInLevel = 0;
    levelBannerUntil = Date.now() + 2000;
    mutePhraseUntil  = Date.now() + LEVEL_MUTE_MS;   // 2 sn "gadeşim" yok
    bubble.until = 0;
    sfx.level();
    TTS.say(SAY_LEVEL, 0.72);
    buildSky();
  }

  function die() {
    if (state !== 'play') return;
    state = 'fall';
    shake = 10;
    flashUntil = Date.now() + 90;
    bubble.until = 0;
    sfx.hit();
    TTS.say(SAY_DEAD, 1.0);
    if (score > best) { best = score; newBest = true; lsSet('gadesim_best', String(best)); }
  }

  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function update() {
    frames++;
    var spd = levelSpeed(level);

    if (state === 'menu') {
      bird.y = GROUND_Y * 0.46 + Math.sin(frames * 0.06) * 7;
      bird.rot += (0 - bird.rot) * 0.2;
      groundX = (groundX + 1.4) % 24;
      bgFar  = (bgFar  + 0.22) % (W + 90);
      bgNear = (bgNear + 0.5)  % (W + 120);
      wingPhase += 0.13;
      return;
    }

    if (state === 'play' || state === 'fall') {
      bird.vy += GRAV;
      if (bird.vy > MAXV) bird.vy = MAXV;
      bird.y += bird.vy;
      if (bird.y < R) { bird.y = R; bird.vy = 0; }
      var target = bird.vy < 0 ? -0.45 : Math.min(1.5, (bird.vy / MAXV) * 1.7);
      bird.rot += (target - bird.rot) * 0.18;
      wingPhase += (state === 'play' ? 0.30 : 0.10);
    }

    if (state === 'play') {
      groundX = (groundX + spd) % 24;
      bgFar  = (bgFar  + spd * 0.14) % (W + 90);
      bgNear = (bgNear + spd * 0.34) % (W + 120);

      for (var i = 0; i < clouds.length; i++) {
        clouds[i].x -= spd * 0.18;
        if (clouds[i].x < -40) { clouds[i].x = W + 20 + Math.random() * 60; clouds[i].y = 40 + Math.random() * (GROUND_Y * 0.42); }
      }

      for (var j = pipes.length - 1; j >= 0; j--) {
        var p = pipes[j];
        p.x -= spd;
        if (!p.scored && p.x + PIPE_W * 0.5 < BIRD_X) {
          p.scored = true;
          score++; passedInLevel++;
          sfx.point();
          if (passedInLevel >= PIPES_PER_LEVEL) levelUp();
        }
        if (p.x + PIPE_W < -20) pipes.splice(j, 1);
      }

      var last = pipes.length ? pipes[pipes.length - 1] : null;
      if (!last || last.x < W - SPACING) spawnPipe();

      for (var k = 0; k < pipes.length; k++) {
        var q = pipes[k];
        if (q.x > BIRD_X + CR || q.x + PIPE_W < BIRD_X - CR) continue;
        if (circleHitsRect(BIRD_X, bird.y, CR, q.x, -400, PIPE_W, q.gapY + 400) ||
            circleHitsRect(BIRD_X, bird.y, CR, q.x, q.gapY + q.gap, PIPE_W, GROUND_Y - (q.gapY + q.gap) + 40)) {
          die(); break;
        }
      }
      if (state === 'play' && bird.y + CR >= GROUND_Y) { bird.y = GROUND_Y - CR; die(); }
    }

    if (state === 'fall') {
      if (bird.y + CR >= GROUND_Y) {
        bird.y = GROUND_Y - CR; bird.vy = 0;
        state = 'over'; overAt = Date.now();
      }
    }

    if (shake > 0) shake *= 0.82;
  }

  /* =====================================================================
     ÇİZİM
  ===================================================================== */
  function txt(s, x, y, size, fill, align, sw) {
    ctx.font = '900 ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.lineJoin = 'round'; ctx.miterLimit = 2;
    var lw = (sw === undefined) ? Math.max(3, size * 0.20) : sw;
    if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.strokeText(s, x, y); }
    ctx.fillStyle = fill; ctx.fillText(s, x, y);
  }
  function rrect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBackground() {
    var p = pal();
    ctx.fillStyle = skyGrad || p.sky1;
    ctx.fillRect(0, 0, W, GROUND_Y);

    if (p.stars) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var tw = 0.55 + 0.45 * Math.sin(frames * 0.05 + s);
        ctx.globalAlpha = tw;
        ctx.fillRect(st.x, st.y, st.r, st.r);
      }
      ctx.globalAlpha = 1;
    }

    // bulutlar
    ctx.fillStyle = p.cloud;
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c], s2 = cl.s;
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, 11 * s2, 0, 6.2832);
      ctx.arc(cl.x + 13 * s2, cl.y + 3 * s2, 8 * s2, 0, 6.2832);
      ctx.arc(cl.x - 12 * s2, cl.y + 4 * s2, 7 * s2, 0, 6.2832);
      ctx.fill();
    }

    // uzak silüet
    ctx.fillStyle = p.far;
    for (var pass = 0; pass < 2; pass++) {
      var off = -bgFar + pass * (W + 90);
      for (var b = 0; b < buildings.length; b++) {
        var bd = buildings[b];
        ctx.fillRect(off + bd.x, GROUND_Y - 22 - bd.h, bd.w, bd.h + 22);
      }
    }
    if (p.stars) {
      ctx.fillStyle = 'rgba(255,214,102,0.55)';
      for (var pass2 = 0; pass2 < 2; pass2++) {
        var off2 = -bgFar + pass2 * (W + 90);
        for (var b2 = 0; b2 < buildings.length; b2++) {
          var bd2 = buildings[b2];
          for (var wy = GROUND_Y - 22 - bd2.h + 8; wy < GROUND_Y - 30; wy += 12) {
            for (var wx = 5; wx < bd2.w - 6; wx += 11) {
              if (((wx + wy + b2) % 3) === 0) ctx.fillRect(off2 + bd2.x + wx, wy, 3, 4);
            }
          }
        }
      }
    }

    // yakın tepeler
    ctx.fillStyle = p.hill;
    for (var pass3 = 0; pass3 < 2; pass3++) {
      var off3 = -bgNear + pass3 * (W + 120);
      for (var hx = 0; hx < W + 140; hx += 62) {
        ctx.beginPath();
        ctx.arc(off3 + hx, GROUND_Y + 6, 34, Math.PI, 0);
        ctx.fill();
      }
    }
  }

  function drawPipe(p) {
    var c = pal();
    var topH = p.gapY;
    var botY = p.gapY + p.gap;
    var botH = GROUND_Y - botY;
    var g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    g.addColorStop(0.00, c.pipeD);
    g.addColorStop(0.18, c.pipeL);
    g.addColorStop(0.45, c.pipe);
    g.addColorStop(1.00, c.pipeD);

    ctx.fillStyle = g;
    ctx.fillRect(p.x, 0, PIPE_W, topH);
    ctx.fillRect(p.x, botY, PIPE_W, botH);

    var CAP_H = 17, CAP_O = 5;
    ctx.fillRect(p.x - CAP_O, topH - CAP_H, PIPE_W + CAP_O * 2, CAP_H);
    ctx.fillRect(p.x - CAP_O, botY, PIPE_W + CAP_O * 2, CAP_H);

    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.strokeRect(p.x + 1, -2, PIPE_W - 2, topH - CAP_H + 2);
    ctx.strokeRect(p.x - CAP_O + 1, topH - CAP_H, PIPE_W + CAP_O * 2 - 2, CAP_H);
    ctx.strokeRect(p.x - CAP_O + 1, botY, PIPE_W + CAP_O * 2 - 2, CAP_H);
    ctx.strokeRect(p.x + 1, botY + CAP_H, PIPE_W - 2, botH - CAP_H + 4);
  }

  function drawGround() {
    var c = pal();
    ctx.fillStyle = c.grass;
    ctx.fillRect(0, GROUND_Y, W, 9);
    ctx.fillStyle = c.ground;
    ctx.fillRect(0, GROUND_Y + 9, W, GROUND_H - 9);
    ctx.fillStyle = c.groundD;
    for (var x = -24; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x - groundX, GROUND_Y + 9);
      ctx.lineTo(x - groundX + 11, GROUND_Y + 9);
      ctx.lineTo(x - groundX + 4, GROUND_Y + 24);
      ctx.lineTo(x - groundX - 7, GROUND_Y + 24);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 1); ctx.lineTo(W, GROUND_Y + 1); ctx.stroke();
  }

  function drawWing(dir, ang, r) {
    ctx.save();
    ctx.translate(-r * 0.62, dir * r * 0.42);
    ctx.rotate(ang * dir * 0.9 + dir * 0.25);
    ctx.beginPath();
    ctx.ellipse(-r * 0.45, 0, r * 0.72, r * 0.30, 0, 0, 6.2832);
    ctx.fillStyle = dir > 0 ? '#e8b62f' : '#ffd75e';
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }

  function drawBird(x, y, rot, r) {
    var ang = Math.sin(wingPhase) * 0.75 - 0.15;
    ctx.save();
    ctx.translate(x, y);

    drawWing(-1, ang, r);
    drawWing(1, ang, r);

    ctx.rotate(rot);
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.closePath(); ctx.clip();
    if (faceReady) ctx.drawImage(face, -r, -r, r * 2, r * 2);
    else { ctx.fillStyle = '#e7c8a6'; ctx.fillRect(-r, -r, r * 2, r * 2); }
    ctx.restore();

    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832);
    ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
  }

  function drawBubble(text, x, y) {
    ctx.font = '900 13px ' + FONT;
    var w = ctx.measureText(text).width + 18;
    var h = 24;
    var bx = Math.max(6, Math.min(W - w - 6, x - w / 2));
    var by = y - h;
    ctx.fillStyle = '#fff6dd';
    rrect(bx, by, w, h, 9); ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 5, by + h - 1); ctx.lineTo(x + 5, by + h - 1); ctx.lineTo(x, by + h + 8);
    ctx.closePath(); ctx.fillStyle = '#fff6dd'; ctx.fill(); ctx.stroke();
    txt(text, bx + w / 2, by + h / 2 + 1, 13, INK, 'center', 0);
  }

  function drawSoundBtn() {
    var x = W - 24, y = 26;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.2832);
    ctx.fillStyle = 'rgba(20,16,10,0.32)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.stroke();
    ctx.fillStyle = '#fff8e6';
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 3); ctx.lineTo(x - 2, y - 3); ctx.lineTo(x + 2, y - 7);
    ctx.lineTo(x + 2, y + 7); ctx.lineTo(x - 2, y + 3); ctx.lineTo(x - 6, y + 3);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff8e6';
    if (soundOn) {
      ctx.beginPath(); ctx.arc(x + 3, y, 5.5, -0.9, 0.9); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(x + 4, y - 5); ctx.lineTo(x + 10, y + 5);
      ctx.moveTo(x + 10, y - 5); ctx.lineTo(x + 4, y + 5); ctx.stroke();
    }
  }

  function drawHud() {
    if (state === 'play' || state === 'fall') {
      txt(String(score), W / 2, 62, 46, '#fff8e6');
    }

    // Level bilgisi zemin şeridinde durur: kuşun uçtuğu sütunu kapatmasın.
    var by = GROUND_Y + 30;
    var lbl = 'LEVEL ' + level;
    ctx.font = '900 12px ' + FONT;
    var lw = ctx.measureText(lbl).width + 18;
    ctx.fillStyle = '#fff4d6';
    rrect(10, by - 13, lw, 26, 13); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    txt(lbl, 10 + lw / 2, by, 12, INK, 'center', 0);

    // level içi ilerleme: 10 engel = 1 level
    var dx = 10 + lw + 10;
    for (var i = 0; i < PIPES_PER_LEVEL; i++) {
      ctx.beginPath(); ctx.arc(dx + i * 8.6, by, 2.8, 0, 6.2832);
      ctx.fillStyle = i < passedInLevel ? '#e0672f' : 'rgba(43,33,23,0.22)';
      ctx.fill();
    }

    txt('rekor ' + best, W - 12, by + 22, 11, 'rgba(43,33,23,0.62)', 'right', 0);
    drawSoundBtn();
  }

  function drawMenu() {
    var cx = W / 2, cy = GROUND_Y * 0.5;
    txt('GADEŞİM', cx, cy - 118, 42, '#ffcf3f');
    txt('flappy ama gadeşim', cx, cy - 88, 13, '#fff6dd', 'center', 3);
    drawBird(cx, bird.y, bird.rot, 26);
    var pulse = 0.72 + 0.28 * Math.sin(frames * 0.09);
    ctx.globalAlpha = pulse;
    txt('BAŞLAMAK İÇİN DOKUN', cx, cy + 96, 17, '#fff8e6');
    ctx.globalAlpha = 1;
    txt('rekor: ' + best, cx, cy + 124, 14, '#ffcf3f');
    txt('sesi aç — tadı öyle çıkıyor', cx, GROUND_Y + 44, 12, 'rgba(43,33,23,0.7)', 'center', 0);
    txt('rekor ' + best, W - 12, GROUND_Y + 66, 11, 'rgba(43,33,23,0.55)', 'right', 0);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(16,12,8,0.34)';
    ctx.fillRect(0, 0, W, H);

    var pw = 224, ph = 178;
    var px = (W - pw) / 2, py = Math.max(46, GROUND_Y * 0.5 - ph * 0.5);

    ctx.fillStyle = '#fff4d6';
    rrect(px, py, pw, ph, 14); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();

    txt('OYUN BİTTİ', W / 2, py + 28, 22, '#e0672f', 'center', 4);

    txt('“kaben senin yapıcaaan', W / 2, py + 56, 13, 'rgba(43,33,23,0.78)', 'center', 0);
    txt('işi yaaa”',              W / 2, py + 73, 13, 'rgba(43,33,23,0.78)', 'center', 0);

    ctx.strokeStyle = 'rgba(43,33,23,0.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px + 20, py + 89); ctx.lineTo(px + pw - 20, py + 89); ctx.stroke();

    var rows = [['SKOR', String(score)], ['REKOR', String(best)], ['LEVEL', String(level)]];
    for (var i = 0; i < rows.length; i++) {
      var ry = py + 108 + i * 24;
      txt(rows[i][0], px + 22, ry, 12, 'rgba(43,33,23,0.62)', 'left', 0);
      txt(rows[i][1], px + pw - 22, ry, 16, INK, 'right', 0);
    }
    if (newBest) {
      ctx.save(); ctx.translate(px + pw - 34, py - 3); ctx.rotate(0.18);
      txt('YENİ REKOR!', 0, 0, 11, '#ffcf3f', 'center', 3);
      ctx.restore();
    }
    if (Date.now() - overAt > 600) {
      var pulse = 0.72 + 0.28 * Math.sin(frames * 0.1);
      ctx.globalAlpha = pulse;
      txt('TEKRAR OYNAMAK İÇİN DOKUN', W / 2, py + ph + 28, 13, '#fff8e6');
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    ctx.save();
    if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawBackground();
    for (var i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
    drawGround();

    if (state !== 'menu') drawBird(BIRD_X, bird.y, bird.rot, R);

    if (state === 'menu') drawMenu();
    else drawHud();

    if (Date.now() < bubble.until && (state === 'play')) {
      drawBubble(bubble.text, BIRD_X + 8, bird.y - R - 8);
    }

    if (Date.now() < levelBannerUntil && state === 'play') {
      var left = levelBannerUntil - Date.now();
      var a = Math.min(1, left / 320);
      ctx.globalAlpha = a;
      var by2 = Math.max(96, GROUND_Y * 0.26);
      txt('LEVEL ' + level, W / 2, by2, 34, '#ffcf3f');
      txt(pal().name, W / 2, by2 + 28, 14, '#fff6dd', 'center', 3);
      txt('“' + SAY_LEVEL + '”', W / 2, by2 + 52, 16, '#ffffff', 'center', 3.5);
      ctx.globalAlpha = 1;
    }

    if (state === 'over') drawOver();

    ctx.restore();

    if (Date.now() < flashUntil) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* =====================================================================
     DÖNGÜ — sabit 60 Hz adım (120 Hz ekranda da aynı hız)
  ===================================================================== */
  var STEP = 1000 / 60;
  var acc = 0, last = performance.now();
  function frame(now) {
    var dt = now - last; last = now;
    if (dt > 250) dt = STEP;          // sekme arkaplandan döndüyse sıçrama olmasın
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard < 5) { update(); acc -= STEP; guard++; }
    if (acc > STEP * 5) acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  /* =====================================================================
     GİRDİ
  ===================================================================== */
  function toVirtual(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
  }

  function press(vx, vy) {
    TTS.prime();
    audio();

    if (vx !== null) {
      var dx = vx - (W - 24), dy = vy - 26;
      if (dx * dx + dy * dy < 22 * 22) {
        soundOn = !soundOn;
        lsSet('gadesim_sound', soundOn ? '1' : '0');
        if (!soundOn) TTS.stop();
        return;
      }
    }

    if (state === 'menu') { startGame(); return; }
    if (state === 'play') { flap(); return; }
    if (state === 'over' && Date.now() - overAt > 600) { startGame(); return; }
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var v = toVirtual(e.clientX, e.clientY);
    press(v.x, v.y);
  }, { passive: false });

  // pointer olayı olmayan eski tarayıcılar için yedek
  if (!window.PointerEvent) {
    cv.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var t = e.changedTouches[0];
      var v = toVirtual(t.clientX, t.clientY);
      press(v.x, v.y);
    }, { passive: false });
    cv.addEventListener('mousedown', function (e) {
      var v = toVirtual(e.clientX, e.clientY);
      press(v.x, v.y);
    });
  }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter' || e.key === ' ') {
      e.preventDefault();
      press(null, null);
    } else if (e.key === 'm' || e.key === 'M') {
      soundOn = !soundOn; lsSet('gadesim_sound', soundOn ? '1' : '0'); if (!soundOn) TTS.stop();
    }
  }, { passive: false });

  // sayfa gezinme/zoom jestlerini kes
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { TTS.stop(); last = performance.now(); acc = 0; }
    else { last = performance.now(); acc = 0; }
  });

  /* ---- başlat ------------------------------------------------------- */
  layout();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
